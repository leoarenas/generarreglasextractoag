name: conciliacion-bancaria-scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            output
          key: state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            state-${{ github.ref_name }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env from GitHub secrets
        shell: bash
        run: |
          cat > .env <<'EOF'
          GOOGLE_SERVICE_ACCOUNT_JSON=${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_FILE=
          SOURCE_SPREADSHEET_ID=${{ secrets.SOURCE_SPREADSHEET_ID }}
          SOURCE_SHEET_NAME=${{ vars.SOURCE_SHEET_NAME || 'Hoja 1' }}
          RULES_SPREADSHEET_ID=${{ secrets.RULES_SPREADSHEET_ID }}
          RULES_SHEET_NAME=${{ vars.RULES_SHEET_NAME || 'Reglas' }}
          POLL_INTERVAL_SECONDS=3600
          RUN_ONCE=true
          DRY_RUN=false
          LOG_LEVEL=INFO
          LLM_PROVIDER=openai
          LLM_MODEL=${{ vars.LLM_MODEL || 'gpt-5.4-mini' }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          BANK_CODE=${{ vars.BANK_CODE || 'macro' }}
          OUTPUT_DIR=output
          STATE_FILE=state.json
          MIN_CONFIDENCE_AUTOPUBLISH=${{ vars.MIN_CONFIDENCE_AUTOPUBLISH || '0.85' }}
          MAX_SAMPLE_ROWS=${{ vars.MAX_SAMPLE_ROWS || '120' }}
          MAX_RULES=${{ vars.MAX_RULES || '30' }}
          EOF

      - name: Run scheduler
        run: python main.py

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            output
          key: state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conciliacion-output-${{ github.run_id }}
          path: |
            output
            state.json
          if-no-files-found: ignore
